<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة النتائج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    html, body { overflow-y: auto; height: auto; min-height: 100%; background: radial-gradient(ellipse at 50% 0%, #1d0810 0%, #07050a 60%) fixed; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 70px; visibility: hidden; }
    header { text-align: center; margin-bottom: 26px; }
    h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 7vw, 2.4rem); margin: 0 0 6px; font-weight: 500; }
    .subtitle { color: var(--text-faint); font-size: .9rem; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card, .response-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    .stat-card { padding: 18px; text-align: center; }
    .stat-number { font-size: 1.9rem; font-weight: 700; color: var(--crimson-glow); }
    .stat-label { color: var(--text-faint); font-size: .8rem; margin-top: 4px; }
    .responses { display: flex; flex-direction: column; gap: 14px; }
    .response-card { padding: 16px 18px; }
    .response-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
        margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .response-index { color: var(--crimson-bright); font-weight: 700; font-size: .9rem; }
    .response-time { color: var(--text-faint); font-size: .82rem; }
    .answers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .answer-item { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; font-size: .9rem; }
    .q-text { color: var(--text-faint); font-size: .76rem; margin-bottom: 4px; }
    .q-val { font-weight: 500; }
    .badge { display: inline-block; margin-inline-start: 6px; font-size: .72rem; color: var(--blush); }
    .empty-state, .loading { text-align: center; color: var(--text-faint); padding: 50px 20px; }

    /* قفل كلمة المرور */
    .lock { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px;
        background: radial-gradient(ellipse at 50% 40%, #250a10 0%, #07050a 65%, #000 100%); }
    .lock-box { width: 100%; max-width: 340px; text-align: center; }
    .lock-box .ico { font-size: 2.6rem; margin-bottom: 8px; }
    .lock-box h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; margin: 0 0 18px; }
    .lock-box input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border);
        background: var(--surface-2); color: var(--text); font-size: 1rem; text-align: center; direction: ltr; outline: none; }
    .lock-box input:focus { border-color: var(--crimson-bright); }
    .lock-box button { margin-top: 12px; width: 100%; }
    .lock-err { color: var(--ember); font-size: .85rem; min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>

<div class="lock" id="lock">
    <form class="lock-box" id="lockForm" autocomplete="off">
        <div class="ico">🔒</div>
        <h2>لوحة النتائج</h2>
        <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" autofocus>
        <button class="btn btn-next" type="submit">دخول</button>
        <div class="lock-err" id="lockErr"></div>
    </form>
</div>

<div class="wrap" id="wrap">
    <header>
        <h1>🌹 نتائج الاستبيان</h1>
        <div class="subtitle">لوحة مباشرة — تتحدث تلقائياً</div>
    </header>
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalCount">—</div><div class="stat-label">إجمالي الردود</div></div>
        <div class="stat-card"><div class="stat-number" id="lastSubmission" style="font-size:1.2rem;padding-top:9px">—</div><div class="stat-label">آخر رد</div></div>
        <div class="stat-card"><div class="stat-number" id="loveAvg">—</div><div class="stat-label">إجابات رومانسية</div></div>
    </div>
    <div class="responses" id="responsesList"><div class="loading">جاري التحميل...</div></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script type="module">
    import { firebaseConfig, DB_PATHS, QUESTIONS, DASHBOARD_PASSWORD_HASH } from './config.js';

    const $ = (id) => document.getElementById(id);
    const qMap = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

    async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function unlock() {
        gsap.to('#lock', { opacity: 0, duration: 0.5, onComplete: () => $('lock').remove() });
        gsap.set('#wrap', { visibility: 'visible' });
        gsap.from('#wrap > *', { y: 20, opacity: 0, duration: 0.7, stagger: 0.1, ease: 'power3.out' });
        startData();
    }

    try { if (sessionStorage.getItem('dash_ok') === DASHBOARD_PASSWORD_HASH) unlock(); } catch (e) {}

    $('lockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const h = await sha256($('pw').value);
        if (h === DASHBOARD_PASSWORD_HASH) {
            try { sessionStorage.setItem('dash_ok', h); } catch (e) {}
            unlock();
        } else {
            $('lockErr').textContent = 'كلمة المرور غير صحيحة';
            gsap.fromTo('.lock-box', { x: -10 }, { x: 0, duration: 0.5, ease: 'elastic.out(1, 0.3)' });
            $('pw').select();
        }
    });

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    async function startData() {
        let onValue, ref, db;
        try {
            const [a, d] = await Promise.all([
                import('https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js'),
                import('https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js')
            ]);
            db = d.getDatabase(a.initializeApp(firebaseConfig));
            ({ onValue, ref } = d);
        } catch (err) {
            $('responsesList').innerHTML = '<div class="empty-state">تعذّر الاتصال بقاعدة البيانات</div>';
            return;
        }

        let first = true;
        onValue(ref(db, DB_PATHS.results), (snap) => {
            const list = $('responsesList');
            if (!snap.exists()) {
                $('totalCount').textContent = '0';
                $('lastSubmission').textContent = '—';
                $('loveAvg').textContent = '—';
                list.innerHTML = '<div class="empty-state">لا توجد ردود حتى الآن</div>';
                return;
            }
            const entries = Object.entries(snap.val())
                .map(([key, v]) => ({ key, ...v }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            $('totalCount').textContent = entries.length;
            $('lastSubmission').textContent = entries[0]?.time || '—';

            let love = 0, traps = 0;
            list.innerHTML = '';
            entries.forEach((entry, i) => {
                const items = Object.entries(entry.answers || {}).map(([qId, answer]) => {
                    const q = qMap[qId];
                    let badge = '';
                    if (q?.isTrap) { traps++; if (answer === q.requiredAnswer) { love++; badge = '<span class="badge">❤️ رومانسي</span>'; } }
                    return `<div class="answer-item"><div class="q-text">${esc(q ? q.text : qId)}</div><div class="q-val">${esc(String(answer))}${badge}</div></div>`;
                }).join('');
                const card = document.createElement('div');
                card.className = 'response-card';
                card.innerHTML = `<div class="response-head"><div class="response-index">رد #${entries.length - i}</div>
                    <div class="response-time">${esc(entry.date || '')} — ${esc(entry.time || '')}</div></div>
                    <div class="answers-grid">${items}</div>`;
                list.appendChild(card);
            });
            $('loveAvg').textContent = traps ? `${love}/${traps}` : '—';
            if (first) { first = false; gsap.from('.response-card', { y: 16, opacity: 0, duration: 0.5, stagger: 0.07, ease: 'power2.out' }); }
        });
    }
</script>
</body>
</html>
