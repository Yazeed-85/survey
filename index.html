<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage">

    <!-- ============ مشهد 1: الطرفية ============ -->
    <section class="scene" id="sceneTerminal" aria-label="intro">
        <div class="scan-overlay" id="scan"></div>
        <div class="terminal" id="terminal">
            <div class="titlebar">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span class="titlebar-label">building_something.html — compiling</span>
            </div>
            <div class="code-area" id="codeArea"></div>
        </div>
        <button class="skip-hint" id="skipBtn" type="button">انقر للتخطي</button>
    </section>

    <!-- ============ مشهد 2: الوردة ============ -->
    <section class="scene" id="sceneRose" aria-label="rose">
        <div class="ambient-glow" id="glow"></div>
        <div class="particles" id="particles"></div>
        <div class="vignette"></div>

        <div class="rose-wrap" id="roseWrap">
            <svg id="roseSvg" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="وردة"></svg>
        </div>

        <div class="rose-caption" id="roseCaption">
            <div class="l1">شيء جميل ينتظرك</div>
            <div class="l2">المسي الوردة للمتابعة</div>
        </div>
    </section>

    <!-- ============ مشهد 3: الاستبيان ============ -->
    <section class="scene" id="sceneSurvey" aria-label="survey">
        <div class="inner">
            <div class="card" id="card">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="q-body" id="qBody">
                    <div class="step-label" id="stepLabel"></div>
                    <h2 class="question" id="questionText"></h2>
                    <div class="answers" id="answersList"></div>
                </div>
                <div class="nav-row">
                    <button class="btn btn-back" id="backBtn" type="button">السابق</button>
                    <button class="btn btn-next" id="nextBtn" type="button" disabled>التالي</button>
                </div>
                <div class="escape-note" id="escapeNote"></div>
            </div>
        </div>
    </section>

    <!-- ============ مشهد 4: الشكر ============ -->
    <section class="scene" id="sceneThanks" aria-label="thanks">
        <div class="inner">
            <svg class="thanks-rose" id="thanksRose" viewBox="70 40 260 270" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <h1 class="thanks-title" id="thanksTitle">تم بنجاح</h1>
            <p class="thanks-sub" id="thanksSub">شكراً لمشاركتك. كانت لحظة جميلة، ونتمنى أن تكوني قد استمتعتِ بها مثلنا تماماً.</p>

            <div class="analysis" id="analysis">
                <div class="a-title">جارٍ تحليل مستوى الحب في إجاباتك…</div>
                <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
                <div class="meter-pct" id="meterPct">0%</div>
                <div class="verdict" id="verdict"></div>
            </div>
        </div>
    </section>
</main>

<div class="flash" id="flash"></div>
<div class="flash red" id="flashRed"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
<noscript><p style="color:#fff;text-align:center;padding:40px">يتطلب هذا الموقع تفعيل JavaScript.</p></noscript>
</body>
</html>
