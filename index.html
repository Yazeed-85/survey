<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="gate" id="gate" type="button" aria-label="دخول">
    <span class="gate-box">
        <svg class="gate-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/></svg>
        <span class="gate-text">دخول</span>
    </span>
</button>
<button class="mute-btn" id="muteBtn" type="button" aria-label="الصوت">🔊</button>

<main id="stage">

    <!-- ============ مشهد 1: الطرفية ============ -->
    <section class="scene" id="sceneTerminal" aria-label="intro">
        <div class="scan-overlay" id="scan"></div>
        <div class="terminal" id="terminal">
            <div class="titlebar">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span class="titlebar-label"><span dir="rtl">برمجة قلب لمار</span>.html — compiling</span>
            </div>
            <div class="code-area" id="codeArea"></div>
        </div>
    </section>

    <!-- ============ مشهد 2: الوردة ============ -->
    <section class="scene" id="sceneRose" aria-label="rose">
        <div class="ambient-glow" id="glow"></div>
        <div class="particles" id="particles"></div>
        <div class="vignette"></div>

        <div class="rose-wrap" id="roseWrap">
            <svg id="roseSvg" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="وردة"></svg>
        </div>

        <div class="rose-caption" id="roseCaption">
            <div class="l1">المسي الوردة</div>
        </div>
    </section>

    <!-- ============ مشهد 3: الاستبيان ============ -->
    <section class="scene" id="sceneSurvey" aria-label="survey">
        <div class="inner">
            <div class="card" id="card">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="q-body" id="qBody">
                    <h2 class="question" id="questionText"></h2>
                    <div class="answers" id="answersList"></div>
                </div>
                <div class="nav-row">
                    <button class="btn btn-back" id="backBtn" type="button">السابق</button>
                    <button class="btn btn-next" id="nextBtn" type="button" disabled>التالي</button>
                </div>
                        </div>
        </div>
    </section>

    <!-- ============ مشهد 4: الشكر ============ -->
    <section class="scene" id="sceneThanks" aria-label="thanks">
        <div class="inner">
            <div class="thanks-rose3d" id="thanksRose3d" style="display:none"></div>
            <svg class="thanks-rose" id="thanksRose" viewBox="55 40 290 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <h1 class="thanks-title" id="thanksTitle">شكراً لك</h1>

            <div class="analysis" id="analysis">
                <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
                <div class="meter-pct" id="meterPct">0%</div>
            </div>

            <svg class="stamp" id="stamp" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="كفو">
                <defs>
                    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
                        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
                    </filter>
                </defs>
                <g filter="url(#rough)" fill="none" stroke="#ff3b5c" stroke-linecap="round">
                    <circle cx="100" cy="100" r="92" stroke-width="6"/>
                    <circle cx="100" cy="100" r="80" stroke-width="2"/>
                    <circle cx="100" cy="100" r="53" stroke-width="1.4" stroke-dasharray="2 6" opacity=".7"/>
                    <path d="M30 100 h18 M152 100 h18" stroke-width="2.5" opacity=".8"/>
                    <text x="100" y="124" text-anchor="middle" fill="#ff3b5c" stroke="none" font-family="'Aref Ruqaa', serif" font-weight="700" font-size="74">كفو</text>
                    <path d="M100 26 l4 9 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z" fill="#ff3b5c" stroke="none" transform="translate(0 -4) scale(1)"/>
                    <path d="M100 156 l3 7 l7 1 l-5 5 l1 7 l-6 -4 l-6 4 l1 -7 l-5 -5 l7 -1 z" fill="#ff3b5c" stroke="none" opacity=".85"/>
                </g>
            </svg>
        </div>
    </section>
</main>

<div class="blackout" id="blackout"></div>
<div class="flash" id="flash"></div>
<div class="flash red" id="flashRed"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
<noscript><p style="color:#fff;text-align:center;padding:40px">يتطلب هذا الموقع تفعيل JavaScript.</p></noscript>
</body>
</html>
